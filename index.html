<style>
:root{
  --bg:#f2f8f4; --card:#ffffff; --ink:#2d3a33; --sub:#6b7d73;
  --accent:#3aa370; --accent-soft:#e3f3ec; --line:#dbe9e2;
  --warn:#e8a33d; --warn-soft:#fbf1e0; --sky:#5b9bd5; --sky-soft:#e7f1fa;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;padding-bottom:40px}
.wrap{max-width:860px;margin:0 auto;padding:14px}
header{background:linear-gradient(135deg,#3aa370,#2f8f5f);color:#fff;border-radius:14px;padding:18px 18px 16px;margin-bottom:14px}
header h1{font-size:20px;font-weight:600}
header p{font-size:12px;opacity:.85;margin-top:2px}
h2{font-size:15px;margin:18px 0 10px;display:flex;align-items:center;gap:8px}
h2 .tag{font-size:11px;font-weight:400;color:var(--sub);background:var(--card);border:1px solid var(--line);border-radius:99px;padding:1px 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.charGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.charChip{border:1px solid var(--line);border-radius:10px;padding:6px 4px;text-align:center;font-size:13px;cursor:pointer;user-select:none;background:#fbfdfc;transition:all .15s}
.charChip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btnRow{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
button{border:none;border-radius:10px;padding:8px 16px;font-size:13px;cursor:pointer}
#calcBtn{background:var(--accent);color:#fff;font-weight:600;flex:1;min-width:140px;padding:11px}
.plain{background:var(--accent-soft);color:var(--accent)}
.matList{display:flex;flex-wrap:wrap;gap:6px}
.mat{background:var(--accent-soft);color:#22654a;border-radius:8px;padding:2px 10px;font-size:12.5px}
.mat.craft{background:var(--warn-soft);color:#9a6a1c}
.mat.craft::before{content:"⚙ ";}
.dungeon{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.dungeon .head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.rank{background:var(--accent);color:#fff;border-radius:8px;min-width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.dname{font-size:15px;font-weight:600}
.score{font-size:12px;color:var(--sub)}
.badge{font-size:11px;border-radius:99px;padding:1px 9px;margin-left:auto}
.badge.exp{background:var(--sky-soft);color:var(--sky)}
.drops{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.drops .mat{background:var(--bg)}
.expOnly{border:1px dashed var(--sky);border-radius:6px}
.notes{font-size:12px;color:var(--sub);margin-top:6px}
.section-note{font-size:12px;color:var(--sub);margin:6px 0 10px}
.craftTree{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:12.5px;color:var(--sub)}
.craftTree b{color:#9a6a1c;font-weight:600}
#result{display:none}
.empty{text-align:center;color:var(--sub);font-size:13px;padding:30px 0}
footer{text-align:center;font-size:11px;color:var(--sub);margin-top:24px}
@media (max-width:480px){.wrap{padding:10px}.charChip{font-size:12.5px}}
</style>
</head>

// ---------- 初始化角色选择 ----------
const grid = document.getElementById('charGrid');
DATA.characters.forEach(c=>{
  const d = document.createElement('div');
  d.className='charChip'; d.textContent=c.name; d.onclick=()=>toggle(c.name);
  grid.appendChild(d);
});
function toggle(name){
  selected.has(name) ? selected.delete(name) : selected.add(name);
  grid.children[[...grid.children].findIndex(x=>x.textContent===name)].classList.toggle('on',selected.has(name));
  document.getElementById('selCount').textContent='已选 '+selected.size;
}
function toggleAll(on){
  selected.clear();
  [...grid.children].forEach(el=>{
    const n=el.textContent;
    if(on){selected.add(n);el.classList.add('on');}
    else el.classList.remove('on');
  });
  document.getElementById('selCount').textContent='已选 '+selected.size;
}

// ---------- 素材来源分类 ----------
function farmableSources(m){ // 可刷副本来源(自由探索/委托探索/属性本等)
  return (DATA.sources[m]||[]).filter(s=>!BUILDINGS.includes(s)&&s!==FORGE&&!s.startsWith('神秘之地'));
}
function isCraftOnly(m){ // 只能靠天地熔炉合成获得
  const src=(DATA.sources[m]||[]).filter(s=>s!==FORGE&&!s.startsWith('神秘之地'));
  return src.every(s=>BUILDINGS.includes(s)) && (DATA.sources[m]||[]).includes(FORGE);
}

// ---------- 计算 ----------
function calc(){
  if(!selected.size){alert('请先勾选至少一个角色');return;}
  // 1. 汇总直接需求
  const need = {}; // name -> {qty, craft:bool(合成展开而来)}
  DATA.characters.filter(c=>selected.has(c.name)).forEach(c=>{
    c.mats.forEach(([m,q])=>{ need[m]=need[m]||{qty:0,craft:false}; need[m].qty+=q; });
  });
  // 2. 展开合成(仅"只能合成获得"的素材),递归
  const craftLines=[];
  function expand(m,qty,mult){
    const rec=DATA.recipes[m]; if(!rec) return;
    craftLines.push({m,qty,ings:rec});
    rec.forEach(([ing,n])=>{
      const q=n*qty;
      if(isCraftOnly(ing)){ expand(ing,q); }
      else { need[ing]=need[ing]||{qty:0,craft:false}; need[ing].qty+=q; need[ing].craft=true; }
    });
    delete need[m];
  }
  Object.keys({...need}).forEach(m=>{
    if(need[m]&&isCraftOnly(m)){ const q=need[m].qty; delete need[m]; expand(m,q); }
  });
  // 3. 展示素材清单
  const ml=document.getElementById('matList'); ml.innerHTML='';
  Object.entries(need).sort((a,b)=>b[1].qty-a[1].qty).forEach(([m,v])=>{
    const s=document.createElement('span');
    s.className='mat'+(v.craft?' craft':'');
    s.textContent=`${m} ×${v.qty}`;
    ml.appendChild(s);
  });
  const ct=document.getElementById('craftTree');
  ct.innerHTML = craftLines.length
    ? '<b>⚙ 合成展开:</b><br>'+craftLines.map(l=>`${l.m} ×${l.qty} ← ${l.ings.map(i=>i[0]+'×'+i[1]).join(' + ')}`).join('<br>')
    : '本套素材无需合成即可直接获取。';

  // 4. 副本统计
  const needMats=Object.keys(need);
  const expOnlyMats=new Set(needMats.filter(m=>{
    const f=farmableSources(m); return f.length>0 && f.every(s=>s.startsWith('委托探索'));
  }));
  const dungeons={}, buildings={};
  needMats.forEach(m=>{
    (DATA.sources[m]||[]).forEach(s=>{
      if(BUILDINGS.includes(s)){ (buildings[s]=buildings[s]||[]).push(m); return; }
      if(s===FORGE||s.startsWith('神秘之地')) return;
      (dungeons[s]=dungeons[s]||[]).push(m);
    });
  });
  // 排序:覆盖素材数多者优先;含远征专属素材的副本加权提前
  const ranked=Object.entries(dungeons).map(([name,mats])=>({
    name,mats,
    n:mats.length,
    hasExp:mats.some(m=>expOnlyMats.has(m))
  })).sort((a,b)=> b.n-a.n || (b.hasExp?1:0)-(a.hasExp?1:0));

  const dl=document.getElementById('dungeonList'); dl.innerHTML='';
  ranked.forEach((d,i)=>{
    const el=document.createElement('div'); el.className='dungeon';
    const matsHtml=d.mats.map(m=>`<span class="mat${expOnlyMats.has(m)?' expOnly':''}" title="${expOnlyMats.has(m)?'仅委托探索产出':''}">${m}${expOnlyMats.has(m)?' 🚩':''}</span>`).join('');
    el.innerHTML=`<div class="head"><span class="rank">${i+1}</span><span class="dname">${d.name}</span>
      ${d.hasExp?'<span class="badge exp">含远征专属素材</span>':''}
      <span class="score">覆盖 ${d.n} 种需求素材</span></div>
      <div class="drops">${matsHtml}</div>`;
    dl.appendChild(el);
  });
  if(!ranked.length) dl.innerHTML='<div class="empty">没有可直接刷取的副本</div>';

  // 5. 建筑区
  const bl=document.getElementById('buildingList'); bl.innerHTML='';
  Object.entries(buildings).forEach(([name,mats])=>{
    const el=document.createElement('div'); el.className='dungeon'; el.style.opacity=.8;
    el.innerHTML=`<div class="head"><span class="dname">🏠 ${name}</span></div>
      <div class="drops">${mats.map(m=>`<span class="mat">${m}</span>`).join('')}</div>`;
    bl.appendChild(el);
  });
  if(!Object.keys(buildings).length) bl.innerHTML='<div class="empty">无</div>';

  document.getElementById('result').style.display='block';
  document.getElementById('result').scrollIntoView({behavior:'smooth'});
}
</script>
</body>
</html>
